<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triplex Villa · 虚拟阴影对比</title>
<style>
* { box-sizing: border-box; letter-spacing: 0; }
:root { color-scheme: dark; font: 14px/1.5 system-ui, sans-serif; background: #131515; color: #edf0ee; }
body { margin: 0; min-height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
header, .toolbar, .metrics { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px; padding: 9px 18px; border-bottom: 1px solid #363b38; }
header { background: #222624; justify-content: space-between; }
h1 { font-size: 17px; font-weight: 650; margin: 0; }
.status { color: #b8c4bd; font-size: 12px; overflow-wrap: anywhere; }
.status[data-error="true"] { color: #ffb5a3; }
.toolbar { gap: 8px 12px; }
.modes { display: flex; border: 1px solid #64736a; border-radius: 5px; overflow: hidden; flex-shrink: 0; }
.modes label { position: relative; cursor: pointer; }
.modes input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.modes span { display: block; padding: 7px 14px; border-bottom: 2px solid transparent; }
.modes input:checked + span { background: #2b4739; border-bottom-color: #8de0ad; color: #c7f9d5; }
.modes label:last-child input:checked + span { background: #48392c; border-bottom-color: #ecc17c; color: #f9ddb0; }
.modes input:focus-visible + span { outline: 2px solid white; outline-offset: -3px; }
button, select { font: inherit; border: 1px solid #68716b; border-radius: 4px; color: inherit; background: #282d29; min-height: 34px; padding: 5px 10px; cursor: pointer; }
button:hover:enabled { background: #3b443d; }
button:disabled, select:disabled { opacity: .45; cursor: default; }
button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid #a3eac1; outline-offset: 2px; }
.modes input:disabled + span { opacity: .55; cursor: wait; }
.route-controls { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.route-controls label { color: #b8c4bd; font-size: 12px; }
.metrics { font-size: 12px; min-height: 36px; color: #aabcb0; gap: 6px 20px; font-variant-numeric: tabular-nums; }
.metrics b { font-weight: 550; color: #edf0ee; }
main { position: relative; flex: 1; min-height: 200px; overflow: hidden; background: #000; }
iframe { width: 100%; height: 100%; border: 0; display: block; }
.loading { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; background: #101210e8; padding: 24px; z-index: 5; }
.loading[hidden] { display: none; }
.loading strong { font-size: 20px; }
.loading p { color: #b8c4bd; margin: 8px 0; overflow-wrap: anywhere; }
.loading button { justify-self: center; margin-top: 12px; }
footer { border-top: 1px solid #363b38; padding: 6px 18px 10px; }
summary { cursor: pointer; color: #becbc2; font-size: 12px; padding: 3px 0; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; max-width: 880px; font-size: 12px; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 12px 4px 0; text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: #b8c4bd; font-weight: 500; }
tbody tr { border-top: 1px solid #2e3530; }
.on { color: #a7e7bd; } .off { color: #ecc17c; }
.footnote { font-size: 11px; color: #8fa196; margin: 5px 0 0; }
#export { margin-left: auto; }
@media (max-width: 660px) {
  header, .toolbar, .metrics { padding: 8px 10px; gap: 7px 10px; }
  header { align-items: flex-start; }
  h1 { font-size: 15px; }
  .status { width: 100%; }
  .toolbar { align-items: flex-start; }
  .modes { width: 100%; }
  .modes label { flex: 1; text-align: center; }
  .modes span { padding: 6px; }
  button, select { font-size: 12px; padding: 5px 7px; }
  .metrics { gap: 4px 12px; }
  footer { padding: 6px 10px; }
  #export { margin-left: 0; }
}
</style>
</head>
<body>
<header>
  <h1>Triplex Villa · 阴影对比</h1>
  <span class="status" id="status" role="status" aria-live="polite">正在加载</span>
</header>
<div class="toolbar">
  <div class="modes" role="radiogroup" aria-label="阴影模式">
    <label><input type="radio" name="mode" value="on" checked><span>虚拟阴影开启</span></label>
    <label><input type="radio" name="mode" value="off"><span>关闭 · 传统阴影</span></label>
  </div>
  <button id="reset" disabled>恢复视角</button>
  <div class="route-controls">
    <label for="route">路线</label>
    <select id="route" disabled><option value="2">转向一圈</option><option value="1">往返移动</option></select>
    <button id="run" disabled>运行 30 秒</button>
    <button id="stop" disabled>停止</button>
  </div>
  <button id="export" disabled>导出记录</button>
</div>
<div class="metrics" aria-label="当前运行状态">
  <span>FPS <b id="fps">待采样</b></span>
  <span>1% Low <b id="low">待采样</b></span>
  <span>渲染 <b id="render-size">待确认</b></span>
  <span>输出 <b id="output-size">1920 × 1080</b></span>
  <span>抗锯齿 <b id="aa">待确认</b></span>
  <span id="quality">Lumen / VT 待确认</span>
</div>
<main id="stage" aria-label="别墅场景">
  <div class="loading" id="loading"><strong id="loading-title">加载虚拟阴影场景</strong><p id="loading-detail">准备资源</p><button id="retry" hidden>重试</button></div>
</main>
<footer>
  <details open>
    <summary>已测基准 · RTX 3070 · 每种模式两轮</summary>
    <div class="table-wrap">
      <table>
        <thead><tr><th>场景</th><th class="off">关闭 FPS / Low</th><th class="on">开启 FPS / Low</th><th>Low 降幅</th></tr></thead>
        <tbody id="baseline"><tr><td colspan="4">加载记录</td></tr></tbody>
      </table>
    </div>
    <p class="footnote">基准：渲染 1400 × 788，输出 1920 × 1080，TSR。Low 为预热后 30 秒采样；上方实时 Low 为近 5 秒。数据均为提交间隔统计。</p>
  </details>
</footer>
<script src="villa-shadow-comparison.js"></script>
</body>
</html>
