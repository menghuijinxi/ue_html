<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triplex Villa · VSM 自适应实测</title>
<style>
* { box-sizing: border-box; letter-spacing: 0; }
:root { color-scheme: dark; font: 14px/1.5 system-ui, sans-serif; color: #e8ecea; background: #171a19; }
body { margin: 0; height: 100dvh; display: flex; flex-direction: column; }
header, .toolbar, .metrics { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px; padding: 8px 16px; border-bottom: 1px solid #3d4440; }
header { justify-content: space-between; background: #262c29; }
h1 { font-size: 16px; margin: 0; font-weight: 600; }
.diagnostic { color: #e2bc83; font-size: 12px; margin-left: 10px; white-space: nowrap; }
#status { font-size: 12px; color: #b7c7bd; overflow-wrap: anywhere; }
#status[data-error=true] { color: #ffb9ac; }
.modes { display: flex; border: 1px solid #809288; border-radius: 4px; overflow: hidden; }
.modes label { position: relative; cursor: pointer; }
.modes input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.modes span { display: block; padding: 6px 12px; border-bottom: 2px solid transparent; }
.modes input:checked + span { background: #254b40; border-bottom-color: #85d7bc; color: #c7f8e5; }
.modes input:disabled + span { opacity: .5; cursor: wait; }
.modes input:focus-visible + span { outline: 2px solid white; outline-offset: -3px; }
select, button { font: inherit; color: inherit; border: 1px solid #7b8b82; border-radius: 4px; background: #2e3530; min-height: 34px; padding: 4px 9px; cursor: pointer; }
button:hover:enabled { background: #455247; }
button:disabled, select:disabled { opacity: .45; cursor: default; }
button:focus-visible, select:focus-visible { outline: 2px solid #94e3c4; outline-offset: 2px; }
.field { display: flex; align-items: center; gap: 7px; font-size: 12px; }
.icon { width: 34px; padding: 0; font-size: 21px; }
#export { margin-left: auto; }
.metrics { font-size: 12px; color: #aebfb5; font-variant-numeric: tabular-nums; }
.metrics b { color: #e6eee8; font-weight: 550; }
main { flex: 1; min-height: 200px; position: relative; background: #000; overflow: hidden; }
iframe { width: 100%; height: 100%; border: 0; display: block; }
#loading { position: absolute; inset: 0; display: grid; place-content: center; padding: 24px; text-align: center; background: #151a17ed; }
#loading strong { font-size: 19px; }
#loading p { color: #b7c7bd; overflow-wrap: anywhere; }
#retry { justify-self: center; }
[hidden] { display: none !important; }
@media (max-width: 660px) {
  header, .toolbar, .metrics { padding: 7px 10px; gap: 6px 12px; }
  h1 { font-size: 14px; }
  #status { width: 100%; }
  .modes { width: 100%; }
  .modes label { flex: 1; text-align: center; }
  .modes span { padding: 6px; }
  #export { margin-left: 0; }
}
</style>
</head>
<body>
<header>
  <h1>Triplex Villa · VSM 自适应实测 <span class="diagnostic">诊断版本</span></h1>
  <span id="status" role="status" aria-live="polite">准备场景</span>
</header>
<div class="toolbar">
  <div class="modes" role="radiogroup" aria-label="VSM 采样模式">
    <label><input type="radio" name="mode" value="baseline"><span>原版 · 完整采样</span></label>
    <label><input type="radio" name="mode" value="adaptive" checked><span>自适应采样</span></label>
  </div>
  <div class="field"><label for="viewpoint">视角</label><select id="viewpoint" disabled>
    <option value="current">当前位置</option><option value="kitchen">厨房金属与玻璃</option>
    <option value="interior">餐厅与窗边</option><option value="living">客厅栏杆</option>
  </select></div>
  <button class="icon" id="reset" title="恢复入口视角" aria-label="恢复入口视角" disabled>↺</button>
  <button id="export" disabled>导出记录</button>
</div>
<div class="metrics" aria-label="实际运行状态">
  <span>FPS <b id="fps">待采样</b></span><span>1% Low <b id="low">待采样</b></span>
  <span>渲染 <b id="render-size">待确认</b></span><span>输出 <b id="output-size">待确认</b></span>
  <span>抗锯齿 <b id="aa">待确认</b></span><span id="quality">Lumen / VT / VSM 待确认</span>
  <span>采样 <b id="sampling">待确认</b></span>
</div>
<main id="stage" aria-label="可漫游的别墅场景">
  <div id="loading"><strong id="loading-title">加载自适应场景</strong><p id="loading-detail">准备资源与管线</p><button id="retry" hidden>重试</button></div>
</main>
<script src="vsm-adaptive-live.js"></script>
</body>
</html>
