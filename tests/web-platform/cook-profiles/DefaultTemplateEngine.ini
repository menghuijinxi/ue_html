; ES3.1 default-template renderer. Keep Cook and browser settings identical.
[SystemSettings]
r.pso.EnableAsyncCacheConsolidation=0
r.TextureStreaming=1
r.Streaming.PoolSize=256
r.Streaming.MaxTempMemoryAllowed=32
r.Mobile.ShadingPath=0
r.MobileHDR=1
r.Mobile.DBuffer=0
r.Mobile.EarlyZPass=1
r.Substrate=0
r.Mobile.AntiAliasing=1
r.AntiAliasingMethod=1
r.Mobile.SupportsGen4TAA=0
r.Mobile.SupportGPUScene=0
r.Mobile.AllowFramebufferFetch=0
r.Mobile.Forward.EnableLocalLights=0
r.Mobile.Forward.EnableClusteredReflections=0
r.Mobile.DisableVertexFog=1
r.Mobile.PixelFogDepthTest=1
r.SupportSkyAtmosphere=1
r.SupportSkyAtmosphereAffectsHeightFog=1
r.VolumetricCloud.Support=1
r.VolumetricCloud=1
r.VolumetricRenderTarget=1
r.VolumetricRenderTarget.Mode=0
r.VolumetricRenderTarget.UpsamplingMode=4
r.VolumetricRenderTarget.WebTracingDownsampleFactor=4
r.VolumetricCloud.ViewRaySampleMaxCount=48
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=4
r.VolumetricCloud.DisableCompute=1
r.VolumetricCloud.ShadowMap=0
r.VolumetricCloud.SkyAO=0
r.VolumetricCloud.Shadow.SampleAtmosphericLightShadowmap=0
r.VolumetricCloud.HighQualityAerialPerspective=0
r.SupportLocalFogVolumes=0
r.VolumetricFog=0
r.ContactShadows=0
r.AllowStaticLighting=0
r.VirtualTextures=0
landscape.SupportGPUCulling=0
r.GPUSkin.UseSceneExtension=0
