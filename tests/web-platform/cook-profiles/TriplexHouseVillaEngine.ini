; Initial compatibility baseline uses the currently implemented Web renderer.
; Desktop Lumen, ray tracing and virtual shadows
; remain outside this profile; record their visual impact in the browser report.
[SystemSettings]
r.pso.EnableAsyncCacheConsolidation=0
r.TextureStreaming=1
r.Streaming.PoolSize=256
r.Streaming.MaxTempMemoryAllowed=32
r.Mobile.ShadingPath=0
r.MobileHDR=1
r.Mobile.DBuffer=0
r.Mobile.EarlyZPass=1
r.Substrate=0
r.Mobile.AntiAliasing=1
r.AntiAliasingMethod=1
r.Mobile.SupportsGen4TAA=0
r.Mobile.SupportGPUScene=0
r.Mobile.AllowFramebufferFetch=0
r.Mobile.Forward.EnableLocalLights=1
r.Mobile.Forward.EnableClusteredReflections=0
r.Mobile.AmbientOcclusion=1
r.AmbientOcclusionLevels=1
r.Mobile.SSAOHalfResolution=1
r.AmbientOcclusion.Compute=0
r.HZB.BuildUseCompute=0
r.Mobile.EnableMovableSpotlightsShadow=1
r.Mobile.DisableVertexFog=1
r.Mobile.PixelFogDepthTest=1
r.SupportSkyAtmosphere=1
r.SupportSkyAtmosphereAffectsHeightFog=1
r.VolumetricCloud.Support=0
r.SupportLocalFogVolumes=0
r.VolumetricFog=0
r.ContactShadows=0
r.AllowStaticLighting=0
r.VirtualTextures=0
landscape.SupportGPUCulling=0
r.GPUSkin.UseSceneExtension=0
r.ReflectionMethod=0
r.ReflectionEnvironment=1
r.ReflectionCapture.CookBakedCaptures=1
r.DynamicGlobalIlluminationMethod=0
r.RayTracing=0
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=0
r.SkinCache.CompileShaders=0
r.AllowGlobalClipPlane=0
